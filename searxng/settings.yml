use_default_settings: true

general:
  debug: false
  instance_name: "Korczak AI Search"

search:
  safe_search: 1
  formats:
    - html
    - json

server:
  secret_key: "change-me-via-SEARXNG_SECRET"
  limiter: false
  image_proxy: false
  public_instance: false

# Keep the local instance focused on general web search. The default
# SearXNG engine set remains available and can be tuned later without
# changing the Korczak AI integration.
