use_default_settings: true

general:
  debug: false
  instance_name: "Korczak AI Search"

search:
  safe_search: 1
  formats:
    - html
    - json

server:
  secret_key: "change-me-via-SEARXNG_SECRET"
  limiter: false
  image_proxy: false
  public_instance: false

engines:
  - name: brave
    engine: brave
    shortcut: br
    disabled: false
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
  - name: bing
    engine: bing
    shortcut: bi
    disabled: false
  - name: google
    engine: google
    shortcut: go
    disabled: false
