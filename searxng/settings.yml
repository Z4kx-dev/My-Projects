use_default_settings: true

# Configuração mínima e estável para a instância local da Korczak AI.
general:
  debug: false
  instance_name: "Korczak AI Search"

search:
  safe_search: 1
  formats:
    - html
    - json

server:
  # O valor real deve ser injetado pelo ambiente/Compose.
  secret_key: "change-me-via-SEARXNG_SECRET"
  limiter: false
  image_proxy: false
  public_instance: false

# Começamos com engines gratuitos e leves. O SearXNG consulta mais de um
# mecanismo; falhas individuais são tratadas pelo próprio SearXNG.
engines:
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
  - name: brave
    engine: brave
    shortcut: br
    disabled: false
  - name: bing
    engine: bing
    shortcut: bi
    disabled: false
