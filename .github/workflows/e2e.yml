name: E2E
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      OLLAMA_URL: http://127.0.0.1:11434
      RPG_LLM_URL: http://127.0.0.1:11434
      RPG_DATA_DIR: ${{ runner.temp }}/rpg-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q backend tests
      - run: python -m pytest -q tests/test_e2e_pipeline.py tests/test_rag_notebook.py tests/test_api_contracts.py tests/test_storage_regressions.py tests/test_llm_streaming.py
      - run: python -c "from backend.app import app; print('rotas:', len(app.url_map._rules))"
      - run: python -c "from backend.app import app; c=app.test_client(); assert c.get('/api/health').status_code in (200,503); assert c.get('/api/worlds').status_code == 200"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check frontend/app.js
      - run: python -m pytest -q tests/test_frontend_contracts.py
